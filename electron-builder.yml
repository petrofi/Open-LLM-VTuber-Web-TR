appId: community.openllmvtuber.tr
productName: Open-LLM-VTuber TR
copyright: Copyright © Open-LLM-VTuber contributors; TR community modifications
directories:
  buildResources: resources
  output: release/${version}
files:
  - out/**/*
  - resources/icon.*
  - LICENSE
  - '!**/*.map'
extraResources:
  - from: .runtime/backend
    to: backend
  - from: .runtime/python
    to: python
  - from: .runtime/licenses
    to: licenses
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: Open-LLM-VTuber-TR
  icon: resources/icon.ico
  signAndEditExecutable: true
nsis:
  artifactName: Open-LLM-VTuber-TR-v${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  installerLanguages: [tr_TR, en_US]
  language: '1055'
  displayLanguageSelector: false
  shortcutName: Open-LLM-VTuber TR
  uninstallDisplayName: Open-LLM-VTuber TR
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  differentialPackage: false
  license: resources/installer-license.txt
  runAfterFinish: true
npmRebuild: false
publish: null
